<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    
    <!-- Mobile Web App Capable (Screensaver Mode) -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <title>蜘蛛侠翻页时钟</title>
    <!-- We keep Tailwind CDN for simplicity in this specific setup, though moving to PostCSS via package.json is also an option -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Fredoka', 'sans-serif'],
              display: ['Bebas Neue', 'sans-serif'],
            },
            colors: {
              judy: {
                primary: '#1E3A8A', // ZPD Blue
                secondary: '#93C5FD',
                accent: '#F472B6', // Pink ears/nose
              },
              nick: {
                primary: '#EA580C', // Fox Orange
                secondary: '#84CC16', // Shirt Green
                accent: '#FEF08A',
              },
              flash: {
                primary: '#57534E', // Sloth Fur
                secondary: '#D6D3D1',
                accent: '#10B981', // DMV Green
              },
            },
            animation: {
              'flip-down': 'flipDown 0.6s cubic-bezier(0.455, 0.030, 0.515, 0.955) forwards',
              'flip-down-slow': 'flipDown 2.5s cubic-bezier(0.455, 0.030, 0.515, 0.955) forwards', 
              'flip-up': 'flipUp 0.6s cubic-bezier(0.455, 0.030, 0.515, 0.955) forwards', 
              'flip-up-slow': 'flipUp 2.5s cubic-bezier(0.455, 0.030, 0.515, 0.955) forwards',
              'bounce-high': 'bounceHigh 2s infinite',
              'bounce-slow': 'bounceHigh 4s infinite',
              'run-across': 'runAcross 8s linear infinite',
              'fade-in-up': 'fadeInUp 0.3s ease-out forwards',
            },
            keyframes: {
              flipDown: {
                '0%': { transform: 'rotateX(0deg)' },
                '100%': { transform: 'rotateX(-180deg)' },
              },
              flipUp: {
                '0%': { transform: 'rotateX(0deg)' },
                '100%': { transform: 'rotateX(180deg)' },
              },
              bounceHigh: {
                '0%, 100%': { transform: 'translateY(0)', animationTimingFunction: 'cubic-bezier(0.8, 0, 1, 1)' },
                '50%': { transform: 'translateY(-25px)', animationTimingFunction: 'cubic-bezier(0, 0, 0.2, 1)' },
              },
              runAcross: {
                '0%': { left: '-60px', transform: 'scaleX(1)' },
                '100%': { left: '100%', transform: 'scaleX(1)' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      body {
        margin: 0;
        overflow: hidden; /* Prevent scrolling for immersive feel */
        background-color: #000;
      }
      .perspective-1000 {
        perspective: 1000px;
      }
      .transform-style-3d {
        transform-style: preserve-3d;
      }
      .backface-hidden {
        backface-visibility: hidden;
      }
      .rotate-x-180 {
        transform: rotateX(180deg);
      }
      /* Custom Scrollbar for chat area */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2); 
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.4); 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
